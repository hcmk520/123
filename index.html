<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>智能多用户云记账 (模块化重构版)</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        .hidden-section { display: none !important; }
    </style>
    <script type="module" src="./js/main.js"></script>
</head>
<body class="bg-slate-100 min-h-screen flex items-center justify-center p-4">

    <div id="authCard" class="w-full max-w-md bg-white rounded-2xl shadow-xl p-8 border border-slate-200">
        <div class="text-center mb-6">
            <h1 id="authTitle" class="text-2xl font-bold text-slate-800">欢迎回来</h1>
            <p id="authSubtitle" class="text-sm text-slate-500 mt-1">请输入您的账户登录记账系统</p>
        </div>
        <form id="authForm" class="space-y-4">
            <div><label class="block text-sm font-medium mb-1">邮箱地址</label><input type="email" id="authEmail" required class="w-full px-3 py-2 border rounded-lg"></div>
            <div><label class="block text-sm font-medium mb-1">密码</label><input type="password" id="authPassword" required minlength="6" class="w-full px-3 py-2 border rounded-lg"></div>
            <div id="inviteKeyField" class="hidden-section"><label class="block text-sm font-medium text-amber-700 mb-1">注册邀请码</label><input type="password" id="authInviteKey" class="w-full px-3 py-2 border border-amber-300 bg-amber-50 rounded-lg"></div>
            <button type="submit" id="authSubmitBtn" class="w-full bg-blue-600 text-white font-medium py-2 rounded-lg">登 录</button>
        </form>
        <div class="text-center mt-4"><button id="toggleAuthModeBtn" class="text-sm text-blue-600">没有账号？去注册</button></div>
    </div>

    <div id="appCard" class="w-full max-w-5xl bg-slate-50 rounded-2xl shadow-xl overflow-hidden border border-slate-200 hidden-section flex flex-col md:flex-row">
        
        <div class="w-full md:w-2/5 bg-white p-6 border-r border-slate-200 space-y-6">
            <div class="flex justify-between items-center">
                <div><h2 class="text-lg font-bold">极简智能记账</h2><p id="userEmailTag" class="text-xs text-slate-400"></p></div>
                <button id="logoutBtn" class="text-xs bg-slate-100 text-slate-500 px-2 py-1 rounded">退出</button>
            </div>
            <hr class="border-slate-100">
            <form id="recordForm" class="space-y-4">
                <div><label class="block text-xs font-bold mb-1">消费日期</label><input type="date" id="dateInput" required class="w-full px-3 py-2 border rounded-lg"></div>
                <div><label class="block text-xs font-bold mb-1">消费描述</label><input type="text" id="descInput" required class="w-full px-3 py-2 border rounded-lg"></div>
                <div><label class="block text-xs font-bold mb-1">金额 (元)</label><input type="number" id="amountInput" step="0.01" required class="w-full px-3 py-2 border rounded-lg"></div>
                <div>
                    <label class="block text-xs font-bold mb-1">消费分类</label>
                    <select id="categorySelect" required class="w-full px-3 py-2 border rounded-lg bg-slate-50"></select>
                    <p id="matchTip" class="text-xs text-green-600 mt-1 invisible">✨ 已智能匹配</p>
                </div>
                <button type="submit" id="saveBtn" class="w-full bg-blue-600 text-white py-2 rounded-lg text-sm">保存记录</button>
            </form>
            <hr class="border-slate-100">
            <div>
                <h3 class="text-xs font-bold mb-2">管理分类</h3>
                <div class="flex gap-2 mb-3">
                    <input type="text" id="newCatInput" placeholder="新分类" class="flex-1 px-2 border rounded-lg text-xs">
                    <button id="addCatBtn" class="bg-slate-800 text-white text-xs px-3 py-1 rounded-lg">添加</button>
                </div>
                <div id="customCatList" class="flex flex-wrap gap-1.5 p-1 bg-slate-50 rounded-lg"></div>
            </div>
        </div>

        <div class="flex-1 p-6 flex flex-col space-y-4">
            <div class="bg-white p-4 rounded-xl border space-y-3">
                <h3 class="text-sm font-bold">高级筛选</h3>
                <div class="grid grid-cols-2 gap-3">
                    <div><label class="block text-xs mb-1">月份筛选</label><input type="month" id="filterMonth" class="w-full border rounded text-xs px-2 py-1"></div>
                    <div><label class="block text-xs mb-1">分类多选</label><div id="filterCategories" class="flex flex-wrap gap-1 border p-1 rounded bg-slate-50 max-h-20 overflow-y-auto"></div></div>
                </div>
            </div>
            <div class="grid grid-cols-2 gap-3">
                <div class="bg-emerald-50 border p-3 rounded-xl"><p class="text-xs font-medium">合计</p><p id="totalSumTag" class="text-xl font-black mt-1">￥0.00</p></div>
                <div class="bg-indigo-50 border p-3 rounded-xl"><p class="text-xs font-medium">笔数</p><p id="totalCountTag" class="text-xl font-black mt-1">0 笔</p></div>
            </div>
            <div class="flex-1 bg-white rounded-xl border p-4 flex flex-col min-h-[300px]">
                <h3 class="text-xs font-bold mb-2">明细</h3>
                <div id="historyContainer" class="flex-1 overflow-y-auto space-y-2"></div>
            </div>
        </div>
    </div>
</body>
</html>
